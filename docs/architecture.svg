<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55d6c2"/></marker></defs><rect width="1200" height="860" fill="#0c1425"/><style>text{font-family:Arial,sans-serif;fill:#edf4ff} .sub{fill:#aabbcf;font-size:15px}.line{stroke:#55d6c2;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><text x="45" y="45" font-size="27" font-weight="bold">ORDER PLATFORM</text><text x="45" y="72" class="sub">Local Kubernetes · event-driven processing · operational evidence</text><rect x="475" y="100" width="250" height="70" rx="12" fill="#172943" stroke="#355578"/><text x="600.0" y="130" text-anchor="middle" font-size="19" font-weight="bold">Browser dashboard</text><text x="600.0" y="155" text-anchor="middle" class="sub">Status and event timeline</text><rect x="475" y="205" width="250" height="70" rx="12" fill="#172943" stroke="#355578"/><text x="600.0" y="235" text-anchor="middle" font-size="19" font-weight="bold">Unprivileged Nginx</text><text x="600.0" y="260" text-anchor="middle" class="sub">Static frontend + API routing</text><path class="line" d="M600 170 V205"/><rect x="45" y="340" width="255" height="75" rx="12" fill="#172943" stroke="#355578"/><text x="172.5" y="370" text-anchor="middle" font-size="19" font-weight="bold">Order API</text><text x="172.5" y="395" text-anchor="middle" class="sub">Idempotent order requests</text><path class="line" d="M600 275 V310 H172 V340"/><path class="line" d="M172 415 V455"/><rect x="330" y="340" width="255" height="75" rx="12" fill="#172943" stroke="#355578"/><text x="457.5" y="370" text-anchor="middle" font-size="19" font-weight="bold">Inventory</text><text x="457.5" y="395" text-anchor="middle" class="sub">Atomic stock reservations</text><path class="line" d="M600 275 V310 H457 V340"/><path class="line" d="M457 415 V455"/><rect x="615" y="340" width="255" height="75" rx="12" fill="#172943" stroke="#355578"/><text x="742.5" y="370" text-anchor="middle" font-size="19" font-weight="bold">Payment</text><text x="742.5" y="395" text-anchor="middle" class="sub">Simulated payment</text><path class="line" d="M600 275 V310 H742 V340"/><path class="line" d="M742 415 V455"/><rect x="900" y="340" width="255" height="75" rx="12" fill="#172943" stroke="#355578"/><text x="1027.5" y="370" text-anchor="middle" font-size="19" font-weight="bold">Notification</text><text x="1027.5" y="395" text-anchor="middle" class="sub">Local event records</text><path class="line" d="M600 275 V310 H1027 V340"/><path class="line" d="M1027 415 V455"/><path d="M172 455 H1027" stroke="#55d6c2" fill="none" stroke-width="2"/><path class="line" d="M600 455 V490"/><rect x="225" y="490" width="750" height="80" rx="12" fill="#173b40" stroke="#355578"/><text x="600.0" y="520" text-anchor="middle" font-size="19" font-weight="bold">RabbitMQ · order.events</text><text x="600.0" y="545" text-anchor="middle" class="sub">order.created → inventory.reserved / inventory.failed → payment.completed</text><rect x="345" y="625" width="510" height="75" rx="12" fill="#172943" stroke="#355578"/><text x="600.0" y="655" text-anchor="middle" font-size="19" font-weight="bold">PostgreSQL</text><text x="600.0" y="680" text-anchor="middle" class="sub">Business tables + transactional outbox + consumer inbox</text><text x="620" y="600" class="sub">Each API commits state and event intent together</text><rect x="45" y="740" width="530" height="75" rx="12" fill="#172943" stroke="#355578"/><text x="310.0" y="770" text-anchor="middle" font-size="19" font-weight="bold">Prometheus + Grafana</text><text x="310.0" y="795" text-anchor="middle" class="sub">HTTP latency · event outcomes · outbox backlog · alerts</text><rect x="605" y="740" width="550" height="75" rx="12" fill="#172943" stroke="#355578"/><text x="880.0" y="770" text-anchor="middle" font-size="19" font-weight="bold">Delivery configuration</text><text x="880.0" y="795" text-anchor="middle" class="sub">GitHub CI · Helm templates · Argo CD application</text><text x="45" y="845" class="sub">Minikube is the running environment. Azure Terraform is prepared, not deployed. See the validation report for delivery status.</text></svg>