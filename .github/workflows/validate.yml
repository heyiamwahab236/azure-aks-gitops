name: Validate application and delivery
on:
  push:
    branches: [main, 'stage/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install test and security tools
        run: |
          python -m pip install -r services/order-service/requirements.txt -r tests/requirements-dev.txt
          mkdir -p reports
      - name: Transaction tests
        run: python -m pytest tests/test_reliability.py -q --junitxml=reports/unit.xml
      - name: SAST (medium and high findings fail)
        run: bandit -r services shared -ll -f json -o reports/bandit.json
      - name: Dependency vulnerability audit
        run: pip-audit -r services/order-service/requirements.txt -f json -o reports/dependencies.json
      - name: Build and run disposable integration stack
        run: docker compose -p portfolio-ci up -d --build --wait --wait-timeout 180
      - name: End-to-end scenarios
        run: python tests/local_scenarios.py http://127.0.0.1:8080
      - name: Container vulnerabilities and SBOMs
        run: |
          for service in order-service inventory-service payment-service notification-service frontend; do
            image=$(docker compose -p portfolio-ci images -q "$service")
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/reports" aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --format cyclonedx --output "/reports/$service.cdx.json" "$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/reports:/reports" aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format json --output "/reports/$service.vulns.json" "$image"
          done
      - name: Passive DAST against disposable frontend
        run: |
          chmod 777 reports
          docker run --rm --network portfolio-ci_default -v "$PWD/reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef zap-baseline.py -t http://frontend:8080 -m 1 -I -J zap.json -r zap.html
      - name: Helm validation and release artifact
        run: |
          helm lint helm/order-platform
          helm template order-platform helm/order-platform -n order-platform > reports/rendered.yaml
          helm package helm/order-platform -d reports
      - name: Preserve reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-${{ github.sha }}
          path: reports/
          retention-days: 14
      - name: Clean disposable CI stack
        if: always()
        run: docker compose -p portfolio-ci down -v

