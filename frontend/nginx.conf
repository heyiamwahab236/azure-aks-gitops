server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/orders {
        proxy_pass http://order-service:8000/orders;
    }

    location /api/inventory {
        proxy_pass http://inventory-service:8000/inventory;
    }

    location /api/payments {
        proxy_pass http://payment-service:8000/payments;
    }

    location /api/notifications {
        proxy_pass http://notification-service:8000/notifications;
    }
}
