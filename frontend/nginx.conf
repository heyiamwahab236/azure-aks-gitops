server {
    listen 8080;
    server_name _;
    server_tokens off;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
    location / { try_files $uri $uri/ /index.html; }
    location /api/orders { proxy_pass http://order-service:8000/orders; }
    location /api/inventory { proxy_pass http://inventory-service:8000/inventory; }
    location /api/payments { proxy_pass http://payment-service:8000/payments; }
    location /api/notifications { proxy_pass http://notification-service:8000/notifications; }
}
