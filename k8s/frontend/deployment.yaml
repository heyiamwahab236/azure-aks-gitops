
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: order-platform

spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: order-platform-frontend:portfolio-20260912
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: frontend-nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
              httpGet:
                path: /
                port: http
              initialDelaySeconds: 5
              periodSeconds: 5
      volumes:
        - name: frontend-nginx-config
          configMap:
            name: frontend-nginx-config

