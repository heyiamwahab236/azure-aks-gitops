apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: order-platform
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/orders {
            proxy_pass http://order-service:80/orders;
        }

        location /api/inventory {
            proxy_pass http://inventory-service:80/inventory;
        }

        location /api/payments {
            proxy_pass http://payment-service:80/payments;
        }

        location /api/notifications {
            proxy_pass http://notification-service:80/notifications;
        }
    }