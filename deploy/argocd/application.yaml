apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: order-platform
  namespace: argocd
spec:
  sourceRepos:
    - git@github.com:heyiamwahab236/azure-aks-gitops.git
  destinations:
    - namespace: order-platform
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ''
      kind: Service
    - group: ''
      kind: ConfigMap
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: order-platform
  namespace: argocd
spec:
  project: order-platform
  source:
    repoURL: git@github.com:heyiamwahab236/azure-aks-gitops.git
    targetRevision: stage/portfolio-completion
    path: helm/order-platform
  destination:
    server: https://kubernetes.default.svc
    namespace: order-platform
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
