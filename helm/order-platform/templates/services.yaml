{{- $databaseUrl := .Values.global.databaseUrl -}}
{{- $rabbitmqUrl := .Values.global.rabbitmqUrl -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}-service
  template:
    metadata:
      labels:
        app: {{ $name }}-service
    spec:
      containers:
        - name: {{ $name }}-service
          image: {{ $svc.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ $svc.port }}
          env:
            {{- if ne $name "frontend" }}
            - name: DATABASE_URL
              value: {{ $databaseUrl | quote }}
            - name: RABBITMQ_URL
              value: {{ $rabbitmqUrl | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ if eq $name "frontend" }}/{{ else }}/health{{ end }}
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-service
spec:
  selector:
    app: {{ $name }}-service
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
